permissions:
  contents: write

...

- name: Test
  run: npm test || true

- name: Configurar Git
  run: |
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"

- name: Instalar standard-version
  run: npm install standard-version --save-dev

- name: Gerar nova versão
  run: |
    npx standard-version
    git push --follow-tags origin develop

      - name: Enviar email em caso de erro
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Erro no pipeline GitHub Actions"
          body: "O pipeline falhou! Verifique o repositório."
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}
name: CI Pipeline

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Test (vai falhar)
        run: npm test || true

      - name: Instalar standard-version
        run: npm install standard-version --save-dev

      - name: Gerar nova versão
        run: npx standard-version

      - name: Enviar email em caso de erro
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Erro no pipeline GitHub Actions"
          body: "O pipeline falhou! Verifique o repositório."
          to: ${{ secrets.EMAIL_USER }}
          from: ${{ secrets.EMAIL_USER }}